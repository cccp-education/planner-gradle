[versions]
kotlin = "2.4.10"
planner = "0.0.2"
plugin-publish = "2.1.0"
kotlinx-serialization = "1.7.3"
langchain4j = "1.16.3"
jackson = "2.18.2"
codebase = "0.0.7"
koog = "0.8.0"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
langchain4j-core = { module = "dev.langchain4j:langchain4j", version.ref = "langchain4j" }
langchain4j-ollama = { module = "dev.langchain4j:langchain4j-ollama", version.ref = "langchain4j" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
koog-agents = { module = "ai.koog:koog-agents", version.ref = "koog" }
codebase-plugin = { module = "education.cccp:codebase-plugin", version.ref = "codebase" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
publish = { id = "com.gradle.plugin-publish", version.ref = "plugin-publish" }
planner = { id = "education.cccp.planner", version.ref = "planner" }

[bundles]
